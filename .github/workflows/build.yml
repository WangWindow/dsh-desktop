name: Build packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-deb:
    name: Build Linux DEB package
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install JavaScript dependencies
        run: bun install

      - name: Build Debian package
        run: bun tauri build --ci --bundles deb

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  build-pacman:
    name: Build Arch Linux pacman package
    runs-on: ubuntu-22.04
    container: archlinux:base-devel
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            bun \
            rust \
            webkit2gtk-4.1 \
            libayatana-appindicator \
            librsvg

      - name: Install JavaScript dependencies
        run: bun install

      - name: Build executable
        run: bun tauri build --ci --no-bundle

      - name: Prepare pacman package
        run: |
          rm -rf pacman-build
          mkdir -p pacman-build
          cp assets/arch/PKGBUILD assets/arch/dsh-desktop.desktop pacman-build/
          cp src-tauri/icons/icon.png pacman-build/
          cp src-tauri/target/release/dsh-desktop pacman-build/
          VERSION=$(bun -e "console.log(JSON.parse(await Bun.file('src-tauri/tauri.conf.json').text()).version)")
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" pacman-build/PKGBUILD

      - name: Build pacman package
        run: |
          useradd --create-home builder
          chown -R builder:builder pacman-build
          su builder -c 'cd pacman-build && makepkg --nodeps --skipinteg'

      - name: Upload pacman package
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-linux-pacman
          path: pacman-build/*.pkg.tar.zst
          if-no-files-found: error

  build-windows:
    name: Build Windows MSI and executable
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install JavaScript dependencies
        run: bun install

      - name: Build MSI installer
        run: bun tauri build --ci --bundles msi

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-windows-exe
          path: src-tauri/target/release/dsh-desktop.exe
          if-no-files-found: error

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-deb
      - build-pacman
      - build-windows
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dsh-desktop-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "DSH Desktop ${GITHUB_REF_NAME}" \
            --generate-notes
